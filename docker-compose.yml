version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: postcare_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: postcare_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: postcare_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/postcare
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=mock
      - JWT_SECRET=super-secret-key-change-in-production-healthcare-2026
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: postcare_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
